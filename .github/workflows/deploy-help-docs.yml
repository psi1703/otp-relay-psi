name: Deploy Help Docs

on:
  push:
    branches: [ main ]
    paths:
      - "docs/help/**"
      - "scripts/build_help_docs.py"
      - ".github/workflows/deploy-help-docs.yml"

jobs:
  deploy-help-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pyyaml

      - name: Build help docs
        run: |
          python scripts/build_help_docs.py

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy generated help content
        run: |
          rsync -avz --delete frontend/help/             "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:/opt/otp-relay/frontend/help/"

      - name: Fix ownership and permissions
        run: |
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}"             "sudo chown -R root:root /opt/otp-relay/frontend/help && sudo find /opt/otp-relay/frontend/help -type f -exec chmod 644 {} \\;"

      - name: Finish
        run: echo "Help docs deployed."
